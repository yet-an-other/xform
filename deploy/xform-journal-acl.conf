# xform journal namespace ACLs — tmpfiles.d rules
#
# Install as /etc/tmpfiles.d/xform-journal-acl.conf, then apply:
#
#   systemd-tmpfiles --create /etc/tmpfiles.d/xform-journal-acl.conf
#
# Grants the unprivileged xform user read access to the `xform` journal
# namespace and nothing else. The panel is deliberately NOT a member of
# systemd-journal, adm, or wheel: those grant every journal on the host, and
# ACLs are per file, not per entry — an ACL on the default namespace would
# expose every entry in each multiplexed file it covers.
#
# Two rules per path:
#
#   a+  sets the access ACL on the namespace directory itself, plus a default
#       ACL (d:) so journal files journald creates later inherit read access.
#       Inheritance is what survives rotation, and journald's 0640 creation
#       mode masks the inherited entry down to r-- on each file.
#   A+  applies to what is already inside — the files an earlier boot or
#       rotation left behind before these rules were installed. It matches the
#       directory's children rather than the directory itself, so the search
#       bit the first rule granted stays untouched.
#
# Both paths are listed because a host may journal persistently, volatilely, or
# both: /run before the first flush after boot, /var afterwards. A rule whose
# path does not exist is a no-op, so shipping both is safe either way.
#
# Boot-time tmpfiles processing runs long before systemd-journald@xform creates
# the volatile directory, so on a volatile host that pass finds nothing to act
# on. xform.service re-applies this file as root on every start, once the
# namespace exists — see the ExecStartPre= line in deploy/xform.service.
#
# %m expands to the machine ID, matching journald's <machine-id>.<namespace>
# directory layout.

#Type Path                         Mode User Group Age Argument
a+    /var/log/journal/%m.xform    -    -    -     -   u:xform:r-x,d:u:xform:r-x
A+    /var/log/journal/%m.xform/*  -    -    -     -   u:xform:r--
a+    /run/log/journal/%m.xform    -    -    -     -   u:xform:r-x,d:u:xform:r-x
A+    /run/log/journal/%m.xform/*  -    -    -     -   u:xform:r--
