name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: internal/go.mod
          cache-dependency-path: internal/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go test and vet
        working-directory: internal
        run: go test ./... && go vet ./...

      - name: Frontend test and typecheck
        working-directory: web
        run: npm ci && npm test && npm run typecheck

      - name: Validate and smoke-test nginx Trusted proxy gateway matrix
        env:
          NGINX_IMAGE: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
        run: deploy/trusted-proxy/nginx/smoke-test.sh

      - name: Validate and smoke-test Caddy Trusted proxy gateway matrix
        env:
          CADDY_IMAGE: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
        run: deploy/trusted-proxy/caddy/smoke-test.sh

      - name: Start and smoke-test Traefik Trusted proxy gateway matrix
        env:
          TRAEFIK_IMAGE: traefik:v3.5.3@sha256:d6be8725d21b45bdd84b93ea01438256e0e3c94aa8fa51834fe87f37cd5d4af8
        run: deploy/trusted-proxy/traefik/smoke-test.sh
