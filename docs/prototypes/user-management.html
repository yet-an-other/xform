<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xform PROTOTYPE — user management (add/edit/remove)</title>
<!--
  PROTOTYPE — throwaway. Ticket: #47 (wayfinder map #44).
  Question: what do the add/edit/remove user affordances on the dashboard look
  and behave like? Three structurally different variants of the Users card:
    A — row actions + modal dialogs (matches existing viewer-dialog conventions)
    B — inline row editing (no modals at all)
    C — manage mode: master-detail split of the users card
  Switch with the bottom bar, arrow keys, or ?variant=A|B|C.
  The bar's "fail" toggle shows the apply-failure surface in each variant.
  All state is in-memory; nothing persists; no backend.
-->
<style>
  :root {
    color-scheme: dark;
    --background: #0b0f14;
    --foreground: #e9eef5;
    --card: #17212d;
    --surface: #121922;
    --surface-strong: #1a2430;
    --border: #253242;
    --border-strong: #34465a;
    --muted: #8d9aaa;
    --primary: #55d6a8;
    --primary-ink: #0b0f14;
    --accent: rgba(85, 214, 168, 0.14);
    --info: #6cb6ff;
    --warning: #f5b94d;
    --destructive: #ff7c86;
    --shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 85% -10%, rgba(61, 107, 145, 0.23), transparent 38rem),
      var(--background);
    color: var(--foreground);
    font: 14px/1.45 var(--sans);
  }
  button { font: inherit; cursor: pointer; }
  code { font-family: var(--mono); }
  .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 120px; }
  .app-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 24px; }
  .wordmark { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
  .version { color: var(--muted); font: 12px var(--mono); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; min-height: 30px;
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(18, 25, 34, 0.72); font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px rgba(85,214,168,0.1); }

  .button {
    border: 1px solid var(--border); border-radius: 8px; background: transparent;
    color: var(--muted); padding: 7px 11px; font-size: 11px; font-weight: 750;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .button:hover, .button:focus-visible { border-color: var(--border-strong); color: var(--foreground); }
  .button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .button.primary:hover { filter: brightness(1.08); color: var(--primary-ink); }
  .button.danger { border-color: rgba(255,124,134,0.5); color: var(--destructive); }
  .button.danger:hover { background: rgba(255,124,134,0.12); }
  .icon-button {
    border: 1px solid transparent; border-radius: 7px; background: transparent;
    color: var(--muted); width: 28px; height: 28px; font-size: 13px; line-height: 1;
  }
  .icon-button:hover { border-color: var(--border); color: var(--foreground); background: rgba(255,255,255,0.03); }
  .icon-button.danger:hover { color: var(--destructive); border-color: rgba(255,124,134,0.4); }

  .users-card { margin-top: 16px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: rgba(18, 25, 34, 0.8); }
  .users-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px 10px; }
  .users-head h2 { margin: 0; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
  .users-head .actions { display: flex; gap: 8px; align-items: center; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 64rem; }
  th {
    padding: 10px 12px; border-top: 1px solid var(--border); color: var(--muted);
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; text-align: left;
  }
  td { padding: 7px 12px; border-top: 1px solid rgba(37, 50, 66, 0.5); vertical-align: top; }
  td.email { font-weight: 600; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .presence { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .presence.on { background: var(--primary); box-shadow: 0 0 0 3px rgba(85,214,168,0.12); }
  .badge {
    display: inline-block; margin-left: 8px; padding: 2px 6px; border: 1px solid var(--border);
    border-radius: 6px; color: var(--muted); font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; vertical-align: middle;
  }
  .badge.fail { border-color: rgba(255,124,134,0.5); color: var(--destructive); }
  tr.gone { opacity: 0.5; }
  tr.row-fail td { box-shadow: inset 3px 0 0 rgba(255,124,134,0.6); }
  tr.row-danger td { background: rgba(255,124,134,0.06); }
  tr.row-draft td { background: rgba(85,214,168,0.05); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; background: transparent;
    color: var(--muted); padding: 4px 10px; font-size: 11px; font-weight: 600;
  }
  .chip.on { border-color: var(--primary); background: var(--accent); color: var(--primary); }
  .chip small { display: block; font-size: 9.5px; opacity: 0.75; }

  /* modal (variant A) — mirrors the existing viewer dialogs */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(4, 8, 12, 0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal {
    width: min(460px, 100%); max-height: calc(100vh - 40px); overflow: auto;
    border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface);
    box-shadow: var(--shadow); padding: 20px;
  }
  .modal h3 { margin: 0 0 4px; font-size: 15px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .field input[type=text] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--background); color: var(--foreground); font: 13px var(--mono);
  }
  .field input[type=text]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .check-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .check-row:has(input:checked) { border-color: var(--primary); background: var(--accent); }
  .check-row .tag { font: 600 12.5px var(--mono); }
  .check-row .desc { color: var(--muted); font-size: 11.5px; }
  .idrow { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .banner {
    border: 1px solid rgba(255,124,134,0.5); background: rgba(255,124,134,0.09); color: var(--destructive);
    border-radius: 8px; padding: 9px 11px; font-size: 12px; margin-bottom: 14px;
  }
  .inline-error { color: var(--destructive); font-size: 11.5px; margin-top: 4px; }

  /* variant C split */
  .split { display: grid; grid-template-columns: 300px 1fr; border-top: 1px solid var(--border); min-height: 380px; }
  .split .list { border-right: 1px solid var(--border); }
  .split .list button.row {
    display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 14px;
    background: transparent; border: 0; border-bottom: 1px solid rgba(37,50,66,0.5);
    color: var(--foreground); text-align: left; font-size: 13px;
  }
  .split .list button.row:hover { background: rgba(255,255,255,0.02); }
  .split .list button.row.sel { background: var(--accent); box-shadow: inset 2px 0 0 var(--primary); }
  .split .list .row .fail-dot { margin-left: auto; color: var(--destructive); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .split .detail { padding: 20px; }
  .split .detail h3 { margin: 0 0 2px; font-size: 15px; }
  .split .detail .sub { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
  .list-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* floating prototype switcher — not part of the design under evaluation */
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border-strong); border-radius: 999px;
    background: #101820; box-shadow: 0 10px 34px rgba(0,0,0,0.6); z-index: 50;
    font-size: 12px;
  }
  .switcher button { border: 1px solid var(--border); background: transparent; color: var(--foreground); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
  .switcher button:hover { border-color: var(--primary); }
  .switcher .label { min-width: 230px; text-align: center; color: var(--muted); }
  .switcher .label b { color: var(--foreground); }
  .switcher .fail.on { border-color: var(--destructive); color: var(--destructive); }
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <h1 class="wordmark">xform</h1>
    <span class="version">v0.0.0-prototype</span>
    <span class="pill"><span class="dot"></span> xray running</span>
  </header>
  <main id="app"></main>
</div>

<nav class="switcher" id="switcher" aria-label="Prototype variant switcher">
  <button type="button" id="prev" title="Previous variant (←)">◀</button>
  <span class="label" id="variantLabel"></span>
  <button type="button" id="next" title="Next variant (→)">▶</button>
  <button type="button" class="fail" id="failToggle" title="Simulate an apply failure">⚠ fail: off</button>
</nav>

<script>
// ---------- fixture data ----------
const INBOUNDS = [
  { tag: "vless-vision", desc: "VLESS · REALITY · tcp :443" },
  { tag: "vless-xhttp",  desc: "VLESS · REALITY · xhttp :8443" },
  { tag: "vless-ws",     desc: "VLESS · TLS · ws cdn :2053" },
];
let seq = 0;
const mkUser = (email, inbounds, extra) => Object.assign({
  id: ++seq, email, inbounds, clientId: crypto.randomUUID(),
  online: false, ips: [], lastSeen: "3h ago", gone: false,
  up: "0 B", down: "0 B", speed: "idle",
}, extra);
let users = [
  mkUser("iris@example.com",  ["vless-vision","vless-xhttp","vless-ws"], { online: true, ips: ["🇳🇱 84.17.45.12","🇩🇪 185.220.101.4"], lastSeen: "now", up: "812 MB", down: "4.1 GB", speed: "↑ 120 kB/s  ↓ 1.4 MB/s" }),
  mkUser("mateo@example.com", ["vless-vision"], { up: "88 MB", down: "640 MB" }),
  mkUser("chen@example.com",  ["vless-vision","vless-xhttp"], { online: true, ips: ["🇯🇵 103.5.140.77"], lastSeen: "now", up: "1.2 GB", down: "9.8 GB", speed: "↑ 40 kB/s  ↓ 310 kB/s" }),
  mkUser("old-pal@example.com", ["vless-ws"], { gone: true, up: "3.4 GB", down: "41 GB", lastSeen: "38d ago" }),
];

// ---------- prototype state ----------
const VARIANTS = [
  { key: "A", name: "Row actions + dialogs" },
  { key: "B", name: "Inline row editing" },
  { key: "C", name: "Manage mode (split view)" },
];
let variant = new URLSearchParams(location.search).get("variant") || "A";
if (!VARIANTS.some(v => v.key === variant)) variant = "A";
let failSim = false;      // simulate apply failure for chen@example.com
let showGone = false;
let modal = null;         // variant A: {kind:'add'|'edit'|'remove', user?}
let draft = null;         // variant B: {email, inbounds:[...]}
let editing = null;       // variant B: user id in edit mode
let removing = null;      // variant B: user id in confirm state
let selected = null;      // variant C: user id or 'new'
let manage = false;       // variant C: manage mode on

const app = document.getElementById("app");
const isFailing = (u) => failSim && u.email === "chen@example.com";
const fmtId = (id) => id.slice(0, 8) + "…" + id.slice(-4);

// ---------- shared bits ----------
function inboundChips(sel, ontoggle) {
  return `<div class="chips">` + INBOUNDS.map(ib =>
    `<button type="button" class="chip ${sel.includes(ib.tag) ? "on" : ""}" data-tag="${ib.tag}">${ib.tag}<small>${ib.desc}</small></button>`
  ).join("") + `</div>`;
}
function goneToggleBtn() {
  const n = users.filter(u => u.gone).length;
  if (!n) return "";
  return `<button type="button" class="button" data-act="toggle-gone">${showGone ? "Hide gone" : `Show gone (${n})`}</button>`;
}
function failBadge(u) { return isFailing(u) ? `<span class="badge fail">apply failed</span>` : ""; }
function visibleUsers() { return showGone ? users : users.filter(u => !u.gone); }

// ---------- variant A: row actions + modal dialogs ----------
function renderA() {
  const rows = visibleUsers().map(u => `
    <tr class="${u.gone ? "gone" : ""} ${isFailing(u) ? "row-fail" : ""}">
      <td><span class="presence ${u.online ? "on" : ""}"></span></td>
      <td class="email">${u.email}${u.gone ? `<span class="badge">gone</span>` : ""}${failBadge(u)}</td>
      <td class="muted">${u.inbounds.map(t => t).join(", ") || "—"}</td>
      <td class="mono">↑ ${u.up}<br>↓ ${u.down}</td>
      <td class="mono">${u.online ? u.speed : `<span class="muted">idle</span>`}</td>
      <td class="mono">${u.ips.length ? u.ips.join("<br>") : `<span class="muted">—</span>`}</td>
      <td class="mono" style="text-align:right">${u.lastSeen}</td>
      <td style="text-align:right; white-space:nowrap">
        <button class="icon-button" title="Details">ⓘ</button>${u.gone ? "" : `
        <button class="icon-button" title="Edit" data-act="edit" data-id="${u.id}">✎</button>
        <button class="icon-button danger" title="Remove" data-act="remove" data-id="${u.id}">🗑</button>`}
      </td>
    </tr>`).join("");
  app.innerHTML = `
    <section class="users-card">
      <div class="users-head">
        <h2>Users</h2>
        <div class="actions">${goneToggleBtn()}<button type="button" class="button primary" data-act="add">+ Add user</button></div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="width:40px"></th><th>User</th><th style="width:180px">Inbounds</th><th style="width:110px">Traffic</th><th style="width:190px">Speed now</th><th style="width:170px">Online IPs</th><th style="width:90px;text-align:right">Last seen</th><th style="width:110px"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>
    ${modal ? renderModal() : ""}`;
}
function renderModal() {
  if (modal.kind === "remove") {
    const u = users.find(x => x.id === modal.user);
    return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-label="Remove user">
      <h3>Remove ${u.email}?</h3>
      <p class="sub">Removed from every inbound, immediately. Traffic history is kept — the user becomes <b>gone</b> and is hidden by default.</p>
      <div class="foot"><button class="button" data-act="close-modal">Cancel</button><button class="button danger" data-act="confirm-remove" data-id="${u.id}">Remove</button></div>
    </div></div>`;
  }
  const isAdd = modal.kind === "add";
  const u = isAdd ? null : users.find(x => x.id === modal.user);
  const sel = isAdd ? modal.inbounds : u.inbounds;
  const fail = !isAdd && isFailing(u);
  return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-label="${isAdd ? "Add" : "Edit"} user">
    <h3>${isAdd ? "Add user" : "Edit " + u.email}</h3>
    <p class="sub">${isAdd ? "Client ID is generated on save. Applied immediately, no restart." : "Email is the identity — changing it means remove + add."}</p>
    ${fail ? `<div class="banner">Apply failed: xray unreachable. Change is stored and retried on each config change.</div>` : ""}
    ${isAdd ? `<div class="field"><label for="f-email">Email</label><input id="f-email" type="text" placeholder="user@example.com"></div>` : ""}
    <div class="field"><label>Inbounds</label>
      ${INBOUNDS.map(ib => `<label class="check-row"><input type="checkbox" data-tag="${ib.tag}" ${sel.includes(ib.tag) ? "checked" : ""}><span><span class="tag">${ib.tag}</span><br><span class="desc">${ib.desc}</span></span></label>`).join("")}
    </div>
    ${isAdd ? "" : `<div class="field"><label>Client ID</label><div class="idrow"><code>${fmtId(u.clientId)}</code><button class="button" data-act="rotate" data-id="${u.id}">⟳ Rotate</button></div></div>`}
    <div class="foot"><button class="button" data-act="close-modal">Cancel</button><button class="button primary" data-act="${isAdd ? "confirm-add" : "confirm-edit"}" ${isAdd ? "" : `data-id="${u.id}"`}>${isAdd ? "Add user" : "Save"}</button></div>
  </div></div>`;
}

// ---------- variant B: inline row editing ----------
function renderB() {
  const chipSel = (node) => [...node.querySelectorAll(".chip.on")].map(c => c.dataset.tag);
  const draftRow = draft ? `
    <tr class="row-draft">
      <td></td>
      <td class="email"><input id="b-email" type="text" placeholder="user@example.com" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);color:var(--foreground);font:12.5px var(--mono)"></td>
      <td colspan="4">${inboundChips(draft.inbounds)}</td>
      <td colspan="2" style="text-align:right; white-space:nowrap">
        <button class="button primary" data-act="b-save-draft">Save</button>
        <button class="button" data-act="b-cancel-draft">Cancel</button>
      </td>
    </tr>` : "";
  const rows = visibleUsers().map(u => {
    if (removing === u.id) return `
      <tr class="row-danger"><td></td><td class="email" colspan="2">Remove ${u.email}? <span class="muted">History kept; user becomes gone.</span></td>
      <td colspan="4" style="text-align:right"><button class="button danger" data-act="b-confirm-remove" data-id="${u.id}">Remove</button> <button class="button" data-act="b-cancel">Cancel</button></td><td></td></tr>`;
    if (editing === u.id) return `
      <tr class="row-draft">
        <td><span class="presence ${u.online ? "on" : ""}"></span></td>
        <td class="email">${u.email}<div class="mono muted" style="margin-top:4px">${fmtId(u.clientId)} <a href="#" data-act="rotate" data-id="${u.id}" style="color:var(--info)">rotate</a></div></td>
        <td colspan="4">${inboundChips(u.inbounds)}</td>
        <td colspan="2" style="text-align:right; white-space:nowrap"><button class="button primary" data-act="b-save-edit" data-id="${u.id}">Save</button> <button class="button" data-act="b-cancel">Cancel</button></td>
      </tr>`;
    return `
    <tr class="${u.gone ? "gone" : ""} ${isFailing(u) ? "row-fail" : ""}">
      <td><span class="presence ${u.online ? "on" : ""}"></span></td>
      <td class="email">${u.email}${u.gone ? `<span class="badge">gone</span>` : ""}${failBadge(u)}
        ${isFailing(u) ? `<div class="inline-error">apply failed: xray unreachable — stored, retrying <a href="#" style="color:var(--info)">retry now</a></div>` : ""}</td>
      <td class="muted">${u.inbounds.join(", ") || "—"}</td>
      <td class="mono">↑ ${u.up}<br>↓ ${u.down}</td>
      <td class="mono">${u.online ? u.speed : `<span class="muted">idle</span>`}</td>
      <td class="mono">${u.ips.length ? u.ips.join("<br>") : `<span class="muted">—</span>`}</td>
      <td class="mono" style="text-align:right">${u.lastSeen}</td>
      <td style="text-align:right; white-space:nowrap">
        <button class="icon-button" title="Details">ⓘ</button>${u.gone ? "" : `
        <button class="icon-button" title="Edit" data-act="b-edit" data-id="${u.id}">✎</button>
        <button class="icon-button danger" title="Remove" data-act="b-remove" data-id="${u.id}">🗑</button>`}
      </td>
    </tr>`;
  }).join("");
  app.innerHTML = `
    <section class="users-card">
      <div class="users-head">
        <h2>Users</h2>
        <div class="actions">${goneToggleBtn()}<button type="button" class="button primary" data-act="b-add">+ Add user</button></div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="width:40px"></th><th>User</th><th style="width:180px">Inbounds</th><th style="width:110px">Traffic</th><th style="width:190px">Speed now</th><th style="width:170px">Online IPs</th><th style="width:90px;text-align:right">Last seen</th><th style="width:110px"></th></tr></thead>
        <tbody>${draftRow}${rows}</tbody>
      </table></div>
    </section>`;
}

// ---------- variant C: manage mode split ----------
function renderC() {
  if (!manage) {
    // normal table (like A but no row actions); "Manage users" enters split mode
    const rows = visibleUsers().map(u => `
      <tr class="${u.gone ? "gone" : ""} ${isFailing(u) ? "row-fail" : ""}">
        <td><span class="presence ${u.online ? "on" : ""}"></span></td>
        <td class="email">${u.email}${u.gone ? `<span class="badge">gone</span>` : ""}${failBadge(u)}</td>
        <td class="muted">${u.inbounds.join(", ") || "—"}</td>
        <td class="mono">↑ ${u.up}<br>↓ ${u.down}</td>
        <td class="mono">${u.online ? u.speed : `<span class="muted">idle</span>`}</td>
        <td class="mono">${u.ips.length ? u.ips.join("<br>") : `<span class="muted">—</span>`}</td>
        <td class="mono" style="text-align:right">${u.lastSeen}</td>
        <td style="text-align:right"><button class="icon-button" title="Details">ⓘ</button></td>
      </tr>`).join("");
    app.innerHTML = `
      <section class="users-card">
        <div class="users-head"><h2>Users</h2>
          <div class="actions">${goneToggleBtn()}<button type="button" class="button" data-act="c-manage">⚙ Manage users</button></div>
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th style="width:40px"></th><th>User</th><th style="width:180px">Inbounds</th><th style="width:110px">Traffic</th><th style="width:190px">Speed now</th><th style="width:170px">Online IPs</th><th style="width:90px;text-align:right">Last seen</th><th style="width:60px"></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </section>`;
    return;
  }
  const list = users.filter(u => showGone || !u.gone).map(u => `
    <button type="button" class="row ${String(selected) === String(u.id) ? "sel" : ""}" data-act="c-select" data-id="${u.id}">
      <span class="presence ${u.online ? "on" : ""}"></span><span class="${u.gone ? "muted" : ""}">${u.email}</span>${isFailing(u) ? `<span class="fail-dot">failed</span>` : ""}
    </button>`).join("");
  let detail;
  if (selected === "new") {
    detail = `<h3>New user</h3><p class="sub">Client ID generated on save. Applied immediately.</p>
      <div class="field"><label for="c-email">Email</label><input id="c-email" type="text" placeholder="user@example.com"></div>
      <div class="field"><label>Inbounds</label>
        ${INBOUNDS.map(ib => `<label class="check-row"><input type="checkbox" data-tag="${ib.tag}"><span><span class="tag">${ib.tag}</span> <span class="desc">${ib.desc}</span></span></label>`).join("")}
      </div>
      <div class="foot" style="display:flex;gap:8px;justify-content:flex-end"><button class="button primary" data-act="c-confirm-add">Add user</button></div>`;
  } else {
    const u = users.find(x => String(x.id) === String(selected)) || users.find(x => !x.gone);
    if (u) {
      detail = `<h3>${u.email}</h3><p class="sub">${u.online ? "online — " + u.ips.join(", ") : "last seen " + u.lastSeen} · ↑ ${u.up} ↓ ${u.down}</p>
        ${isFailing(u) ? `<div class="banner">Apply failed: xray unreachable. Change stored, retried on each config change.</div>` : ""}
        <div class="field"><label>Client ID</label><div class="idrow"><code>${fmtId(u.clientId)}</code><button class="button" data-act="rotate" data-id="${u.id}">⟳ Rotate</button></div></div>
        <div class="field"><label>Inbounds</label>
          ${INBOUNDS.map(ib => `<label class="check-row"><input type="checkbox" data-tag="${ib.tag}" ${u.inbounds.includes(ib.tag) ? "checked" : ""}><span><span class="tag">${ib.tag}</span> <span class="desc">${ib.desc}</span></span></label>`).join("")}
        </div>
        <div class="foot" style="display:flex;gap:8px;justify-content:space-between">
          <button class="button danger" data-act="c-remove" data-id="${u.id}">Remove user</button>
          <button class="button primary" data-act="c-save" data-id="${u.id}">Save changes</button>
        </div>`;
    } else detail = `<p class="muted">Select a user.</p>`;
  }
  app.innerHTML = `
    <section class="users-card">
      <div class="users-head"><h2>Users — manage</h2>
        <div class="actions">${goneToggleBtn()}<button type="button" class="button" data-act="c-unmanage">← Back to table</button></div>
      </div>
      <div class="split">
        <div class="list">
          <div class="list-head"><span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em">Roster</span><button class="button primary" data-act="c-new">+ New</button></div>
          ${list}
        </div>
        <div class="detail">${detail}</div>
      </div>
    </section>`;
}

// ---------- render + events ----------
function render() {
  document.getElementById("variantLabel").innerHTML = `<b>${variant}</b> — ${VARIANTS.find(v=>v.key===variant).name}`;
  document.getElementById("failToggle").textContent = `⚠ fail: ${failSim ? "on" : "off"}`;
  document.getElementById("failToggle").classList.toggle("on", failSim);
  if (variant === "A") renderA();
  else if (variant === "B") renderB();
  else renderC();
  const f = document.getElementById("f-email") || document.getElementById("b-email") || document.getElementById("c-email");
  if (f) f.focus();
}
function setVariant(v) {
  variant = v; modal = draft = editing = removing = null;
  const p = new URLSearchParams(location.search); p.set("variant", v);
  history.replaceState(null, "", "?" + p.toString());
  render();
}
function cycle(d) {
  const i = VARIANTS.findIndex(v => v.key === variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("failToggle").onclick = () => { failSim = !failSim; render(); };
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "Escape" && modal) { modal = null; render(); }
});

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (e.target.classList.contains("chip")) { e.target.classList.toggle("on"); return; }
  if (e.target.classList.contains("modal-backdrop")) { modal = null; render(); return; }
  if (!el) return;
  e.preventDefault();
  const act = el.dataset.act, id = Number(el.dataset.id);
  const checkedTags = (root) => [...root.querySelectorAll("input[type=checkbox]:checked")].map(c => c.dataset.tag);
  switch (act) {
    case "toggle-gone": showGone = !showGone; break;
    case "rotate": { const u = users.find(x => x.id === id); u.clientId = crypto.randomUUID(); break; }
    // variant A
    case "add": modal = { kind: "add", inbounds: INBOUNDS.map(i => i.tag) }; break;
    case "edit": modal = { kind: "edit", user: id }; break;
    case "remove": modal = { kind: "remove", user: id }; break;
    case "close-modal": modal = null; break;
    case "confirm-add": {
      const em = document.getElementById("f-email").value.trim(); if (!em) return;
      users.push(mkUser(em, checkedTags(app), { lastSeen: "—" })); modal = null; break;
    }
    case "confirm-edit": { const u = users.find(x => x.id === id); u.inbounds = checkedTags(app); modal = null; break; }
    case "confirm-remove": { const u = users.find(x => x.id === id); u.gone = true; modal = null; break; }
    // variant B
    case "b-add": draft = { inbounds: [...INBOUNDS.map(i=>i.tag)] }; editing = removing = null; break;
    case "b-edit": editing = id; draft = removing = null; break;
    case "b-remove": removing = id; draft = editing = null; break;
    case "b-cancel": draft = editing = removing = null; break;
    case "b-save-draft": {
      const em = document.getElementById("b-email").value.trim(); if (!em) return;
      users.push(mkUser(em, [...app.querySelectorAll(".row-draft .chip.on")].map(c => c.dataset.tag), { lastSeen: "—" })); draft = null; break;
    }
    case "b-save-edit": { const u = users.find(x => x.id === id); u.inbounds = [...app.querySelectorAll(".row-draft .chip.on")].map(c => c.dataset.tag); editing = null; break; }
    case "b-confirm-remove": { const u = users.find(x => x.id === id); u.gone = true; removing = null; break; }
    // variant C
    case "c-manage": manage = true; selected = (users.find(u => !u.gone) || {}).id; break;
    case "c-unmanage": manage = false; break;
    case "c-select": selected = id; break;
    case "c-new": selected = "new"; break;
    case "c-confirm-add": {
      const em = document.getElementById("c-email").value.trim(); if (!em) return;
      const u = mkUser(em, checkedTags(app), { lastSeen: "—" }); users.push(u); selected = u.id; break;
    }
    case "c-save": { const u = users.find(x => x.id === id); u.inbounds = checkedTags(app); break; }
    case "c-remove": { const u = users.find(x => x.id === id); u.gone = true; selected = (users.find(x => !x.gone) || {}).id; break; }
  }
  render();
});
render();
</script>
</body>
</html>
